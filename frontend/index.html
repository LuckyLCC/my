<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健身房会员管理后台</title>

  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />

  <style>
    html, body { height: 100%; margin: 0; background: #f5f7fa; }
    #app { height: 100%; }
    .layout { height: 100%; }
    .aside {
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .brand {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand small { opacity: 0.7; font-weight: 600; margin-left: 8px; }
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid #ebeef5;
    }
    .content {
      padding: 16px;
      height: calc(100vh - 56px);
      overflow: auto;
      background: #f5f7fa;
    }
    .card {
      background: #fff;
      border: 1px solid #ebeef5;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .muted { color: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .full-width { width: 100%; }

    /* Element Plus tweaks for dark aside */
    .el-menu { border-right: none; background: transparent; }
    .el-menu-item, .el-sub-menu__title { color: #cbd5e1 !important; }
    .el-menu-item.is-active { background: rgba(59,130,246,0.18) !important; color: #fff !important; }
    .el-menu-item:hover, .el-sub-menu__title:hover { background: rgba(148,163,184,0.10) !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
  <!-- Axios -->
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <!-- Day.js for date formatting -->
  <script src="https://unpkg.com/dayjs/dayjs.min.js"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>

  <script>
    (function boot() {
      function showBootError(title, details) {
        const root = document.getElementById('app') || document.body;
        root.innerHTML = `
          <div style="max-width:980px;margin:40px auto;padding:18px 18px;border:1px solid #fca5a5;background:#fff;border-radius:12px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;">
            <div style="font-size:18px;font-weight:800;color:#991b1b;">${title}</div>
            <div style="margin-top:10px;color:#334155;line-height:1.6;">
              <div>这通常是 CDN 资源未加载或脚本运行时报错导致的白屏。</div>
              <div>请打开浏览器开发者工具 Console / Network 查看具体失败项。</div>
            </div>
            <pre style="margin-top:12px;white-space:pre-wrap;background:#0b1220;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;">${details || ''}</pre>
            <div style="margin-top:12px;color:#334155;line-height:1.6;">
              <div><b>快速排查：</b></div>
              <div>1) 确认能访问 <span style="font-family:ui-monospace,monospace;">unpkg.com</span>（公司网络/代理可能拦截）</div>
              <div>2) 右键页面 → 检查 → Network，看看 Vue/ElementPlus/axios 是否 200</div>
              <div>3) 建议用本地 http 服务打开（而不是 file://）：<span style="font-family:ui-monospace,monospace;">python3 -m http.server 5173</span></div>
            </div>
          </div>
        `;
      }

      try {
        if (!window.Vue) throw new Error('Vue 未加载（window.Vue 不存在）');
        if (!window.ElementPlus) throw new Error('Element Plus 未加载（window.ElementPlus 不存在）');
        if (!window.axios) throw new Error('Axios 未加载（window.axios 不存在）');

        const { createApp, ref, reactive, computed, watch, onMounted, defineComponent, h } = window.Vue;

    // ----------------------------
    // Axios global config
    // ----------------------------
    const http = axios.create({
      baseURL: 'http://localhost:8080',
      withCredentials: true
    });

    function getToken() {
      return localStorage.getItem('token') || '';
    }
    function setToken(token) {
      localStorage.setItem('token', token || '');
    }
    function clearToken() {
      localStorage.removeItem('token');
    }

    http.interceptors.request.use((config) => {
      const token = getToken();
      if (token) {
        config.headers = config.headers || {};
        config.headers['Authorization'] = 'Bearer ' + token;
      }
      return config;
    });

    // ----------------------------
    // Helpers
    // ----------------------------
    function isDateKey(key) {
      // only treat typical date/time keys as date-like; avoid matching words like "Times"/"remainingTimes"
      return /(date$|Date$|At$|Time$|time$|expiresAt$|expires_at$)/.test(String(key));
    }
    function formatValue(key, val) {
      if (val === null || val === undefined) return '';
      if (typeof val === 'object') return JSON.stringify(val);
      if (key === 'status' || /status$/i.test(key)) {
        if (val === 1 || val === '1') return '启用';
        if (val === 0 || val === '0') return '禁用';
        return String(val);
      }
      if (isDateKey(key)) {
        // backend might return "yyyy-MM-dd" or "yyyy-MM-dd HH:mm:ss"
        const s = String(val);
        if (!s) return '';
        const d = dayjs(s);
        if (d.isValid()) {
          return s.length > 10 ? d.format('YYYY-MM-DD HH:mm:ss') : d.format('YYYY-MM-DD');
        }
        return s;
      }
      return String(val);
    }

    function pick(obj, keys) {
      const out = {};
      keys.forEach(k => { if (obj[k] !== undefined) out[k] = obj[k]; });
      return out;
    }

    // ----------------------------
    // Generic CRUD View
    // ----------------------------
    const CrudView = defineComponent({
      name: 'CrudView',
      props: {
        module: { type: Object, required: true },
        authVersion: { type: Number, required: true },
        isAuthed: { type: Boolean, required: true },
        currentEmployeeId: { type: [Number, String, null], required: false, default: null },
        cardTypes: { type: Array, required: false, default: () => [] },
        employees: { type: Array, required: false, default: () => [] },
        onRefreshCardTypes: { type: Function, required: false, default: null },
        onRefreshEmployees: { type: Function, required: false, default: null }
      },
      setup(props) {
        const loading = ref(false);
        const rows = ref([]);
        const errorText = ref('');

        const createDialogVisible = ref(false);
        const createForm = reactive({});
        const createFormRef = ref();

        const editDialogVisible = ref(false);
        const editForm = reactive({});
        const editingRow = ref(null);

        const checkinHistoryVisible = ref(false);
        const checkinHistory = ref([]);
        const currentCheckinMember = ref(null);
        const checkinLoading = ref(false);

        const cardDetailVisible = ref(false);
        const cardDetailList = ref([]);
        const currentCardDetailEmployee = ref(null);

        const renewDialogVisible = ref(false);
        const renewForm = reactive({
          memberId: null,
          cardTypeId: null,
          renewDate: dayjs().format('YYYY-MM-DD'),
          employeeId: null,
          remark: ''
        });
        const renewLoading = ref(false);
        const currentRenewMember = ref(null);

        const renewHistoryVisible = ref(false);
        const renewHistory = ref([]);
        const renewHistoryLoading = ref(false);

        const summaryInfo = ref(null); // 用于存储开卡统计汇总信息

        const listParams = reactive({});

        const canCreate = computed(() => !!props.module.create);
        const canDelete = computed(() => !!props.module.delete);
        const canUpdate = computed(() => !!props.module.update);
        const isReadOnly = computed(() => !canCreate.value && !canDelete.value);

        function initForms() {
          // init create form
          Object.keys(createForm).forEach(k => delete createForm[k]);
          (props.module.formFields || []).forEach(f => {
            const def = f.default;
            if (typeof def === 'function') {
              createForm[f.key] = def({ currentEmployeeId: props.currentEmployeeId, module: props.module, cardTypes: props.cardTypes, employees: props.employees });
            } else {
              createForm[f.key] = def !== undefined ? def : '';
            }
          });
          
          // 如果默认选择的卡种是次卡，自动填充剩余次数
          if (createForm.cardTypeId) {
            const selectedCardType = props.cardTypes?.find(ct => ct.id === createForm.cardTypeId);
            if (selectedCardType?.type === 'TIMES') {
              createForm.remainingTimes = selectedCardType.duration || 0;
            } else {
              createForm.remainingTimes = null;
            }
          }

          // init edit form keys
          Object.keys(editForm).forEach(k => delete editForm[k]);
          (props.module.formFields || []).forEach(f => {
            editForm[f.key] = '';
          });

          // init list params
          Object.keys(listParams).forEach(k => delete listParams[k]);
          (props.module.listParams || []).forEach(p => {
            listParams[p.key] = p.default !== undefined ? p.default : '';
          });
        }

        async function loadList() {
          if (!props.isAuthed) {
            rows.value = [];
            errorText.value = '未登录：请先登录后再加载数据';
            return;
          }
          errorText.value = '';
          loading.value = true;
          try {
            const moduleKey = props.module?.key || 'unknown';
            const url = props.module?.list?.url || '';
            console.log(`[loadList] 加载数据: module="${moduleKey}", url="${url}"`);
            let res;
            if (props.module.list && props.module.list.method === 'GET') {
              res = await http.get(props.module.list.url, { params: props.module.list.params ? props.module.list.params(listParams) : listParams });
            } else {
              res = await http.request({ method: props.module.list.method || 'GET', url: props.module.list.url, params: listParams });
            }
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '加载失败');
            
            // 特殊处理：开卡统计模块返回的是MonthlyCardSummary对象
            if (moduleKey === 'cardSummary' && body.data && body.data.employeeStats) {
              // 保存汇总信息
              summaryInfo.value = {
                month: body.data.month,
                totalCardAmount: body.data.totalCardAmount,
                totalCardCount: body.data.totalCardCount
              };
              // 显示员工统计列表
              const data = Array.isArray(body.data.employeeStats) ? body.data.employeeStats : [];
              console.log(`[loadList] 加载完成: module="${moduleKey}", 汇总金额=${body.data.totalCardAmount}, 汇总数量=${body.data.totalCardCount}, 员工数=${data.length}`);
              rows.value = data;
            } else {
              const data = Array.isArray(body.data) ? body.data : (body.data ? [body.data] : []);
              console.log(`[loadList] 加载完成: module="${moduleKey}", 数据条数=${data.length}`);
              rows.value = data;
            }
            
            // 如果是会员管理模块，确保员工列表已加载（用于显示员工姓名）
            if (moduleKey === 'members' && props.onRefreshEmployees) {
              await props.onRefreshEmployees();
            }
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            errorText.value = serverMsg || e?.message || String(e);
            console.error(`[loadList] 加载失败: module="${props.module?.key}", error=`, e);
          } finally {
            loading.value = false;
          }
        }

        async function openCreate() {
          // 如果模块需要卡种数据（比如会员管理的 cardTypeId 字段），打开弹窗前刷新卡种列表
          const needsCardTypes = props.module.formFields && props.module.formFields.some(f => f.key === 'cardTypeId');
          if (needsCardTypes && props.onRefreshCardTypes) {
            await props.onRefreshCardTypes();
          }
          // 如果模块需要员工数据（比如会员管理的 employeeId 字段），打开弹窗前刷新员工列表
          const needsEmployees = props.module.formFields && props.module.formFields.some(f => f.key === 'employeeId');
          if (needsEmployees && props.onRefreshEmployees) {
            await props.onRefreshEmployees();
          }
          initForms();
          createDialogVisible.value = true;
        }

        async function submitCreate() {
          errorText.value = '';
          loading.value = true;
          try {
            const payload = props.module.create && props.module.create.payload
              ? props.module.create.payload(createForm, { currentEmployeeId: props.currentEmployeeId, module: props.module, cardTypes: props.cardTypes })
              : { ...createForm };
            const res = await http.post(props.module.create.url, payload);
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '新增失败');
            createDialogVisible.value = false;
            await loadList();
            ElementPlus.ElMessage.success(body.message || '新增成功');
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            ElementPlus.ElMessage.error(serverMsg || e?.message || String(e));
          } finally {
            loading.value = false;
          }
        }

        function openEdit(row) {
          editingRow.value = row;
          (props.module.formFields || []).forEach(f => {
            let v = row ? row[f.key] : '';
            if ((v === undefined || v === null || v === '') && f.key === 'cardTypeId' && row?.cardType?.id) {
              v = row.cardType.id;
            }
            editForm[f.key] = v !== undefined ? v : '';
          });
          
          // 如果编辑的会员是次卡，确保剩余次数字段有值
          if (editForm.cardTypeId) {
            const selectedCardType = props.cardTypes?.find(ct => ct.id === editForm.cardTypeId);
            if (selectedCardType?.type === 'TIMES' && (editForm.remainingTimes === undefined || editForm.remainingTimes === null || editForm.remainingTimes === '')) {
              editForm.remainingTimes = selectedCardType.duration || row?.remainingTimes || 0;
            } else if (selectedCardType?.type !== 'TIMES') {
              editForm.remainingTimes = null;
            }
          }
          
          editDialogVisible.value = true;
        }

        async function submitEdit() {
          errorText.value = '';
          loading.value = true;
          try {
            const row = editingRow.value || {};
            const payload = props.module.update && props.module.update.payload
              ? props.module.update.payload(editForm, row, { currentEmployeeId: props.currentEmployeeId, module: props.module, cardTypes: props.cardTypes })
              : { ...editForm };
            const url = props.module.update.url(row);
            const res = await http.put(url, payload);
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '更新失败');
            editDialogVisible.value = false;
            await loadList();
            ElementPlus.ElMessage.success(body.message || '更新成功');
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            ElementPlus.ElMessage.error(serverMsg || e?.message || String(e));
          } finally {
            loading.value = false;
          }
        }

        async function doDelete(row) {
          errorText.value = '';
          try {
            await ElementPlus.ElMessageBox.confirm('确认删除该记录？此操作不可撤销。', '删除确认', {
              confirmButtonText: '删除',
              cancelButtonText: '取消',
              type: 'warning'
            });
          } catch {
            return;
          }
          loading.value = true;
          try {
            const url = props.module.delete.url(row);
            const res = await http.delete(url);
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '删除失败');
            ElementPlus.ElMessage.success(body.message || '删除成功');
            await loadList();
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            ElementPlus.ElMessage.error(serverMsg || e?.message || String(e));
          } finally {
            loading.value = false;
          }
        }

        async function doCheckin(row) {
          checkinLoading.value = true;
          try {
            const res = await http.post(`/api/members/${row.id}/checkin`);
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '签到失败');
            ElementPlus.ElMessage.success(body.message || '签到成功');
            await loadList(); // 刷新列表
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            ElementPlus.ElMessage.error(serverMsg || e?.message || String(e));
          } finally {
            checkinLoading.value = false;
          }
        }

        async function openCheckinHistory(row) {
          currentCheckinMember.value = row;
          checkinLoading.value = true;
          try {
            const res = await http.get(`/api/members/${row.id}/checkins`);
            const body = res.data || {};
            if (body.code === 200 && Array.isArray(body.data)) {
              checkinHistory.value = body.data;
            } else {
              checkinHistory.value = [];
            }
            checkinHistoryVisible.value = true;
          } catch (e) {
            ElementPlus.ElMessage.error('加载签到历史失败：' + (e?.message || String(e)));
            checkinHistory.value = [];
          } finally {
            checkinLoading.value = false;
          }
        }

        function openCardDetail(row) {
          currentCardDetailEmployee.value = row;
          if (row?.cardMembers && Array.isArray(row.cardMembers)) {
            cardDetailList.value = row.cardMembers;
          } else {
            cardDetailList.value = [];
          }
          cardDetailVisible.value = true;
        }

        async function openRenew(row) {
          currentRenewMember.value = row;
          renewForm.memberId = row.id;
          renewForm.cardTypeId = row.cardTypeId || null;
          renewForm.renewDate = dayjs().format('YYYY-MM-DD');
          renewForm.employeeId = props.currentEmployeeId || null;
          renewForm.remark = '';
          // 打开对话框前重新加载卡种列表，确保显示最新的启用状态
          if (props.onRefreshCardTypes && typeof props.onRefreshCardTypes === 'function') {
            try {
              await props.onRefreshCardTypes();
              console.log('[openRenew] 已重新加载卡种列表');
            } catch (e) {
              console.warn('[openRenew] 重新加载卡种列表失败:', e);
            }
          }
          // 确保员工数据已加载
          if (props.onRefreshEmployees && typeof props.onRefreshEmployees === 'function') {
            try {
              await props.onRefreshEmployees();
              console.log('[openRenew] 已重新加载员工列表');
            } catch (e) {
              console.warn('[openRenew] 重新加载员工列表失败:', e);
            }
          }
          renewDialogVisible.value = true;
        }

        async function submitRenew() {
          if (!renewForm.memberId || !renewForm.cardTypeId || !renewForm.renewDate) {
            ElementPlus.ElMessage.warning('请填写完整信息');
            return;
          }
          renewLoading.value = true;
          try {
            const res = await http.post('/api/members/renew', {
              memberId: renewForm.memberId,
              cardTypeId: renewForm.cardTypeId,
              renewDate: renewForm.renewDate,
              employeeId: renewForm.employeeId || props.currentEmployeeId,
              remark: renewForm.remark || null
            });
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '续卡失败');
            ElementPlus.ElMessage.success(body.message || '续卡成功');
            renewDialogVisible.value = false;
            await loadList(); // 刷新列表
          } catch (e) {
            const serverMsg = e?.response?.data?.message;
            ElementPlus.ElMessage.error(serverMsg || e?.message || String(e));
          } finally {
            renewLoading.value = false;
          }
        }

        async function openRenewHistory(row) {
          currentRenewMember.value = row;
          renewHistoryLoading.value = true;
          try {
            const res = await http.get(`/api/members/${row.id}/renew-history`);
            const body = res.data || {};
            if (body.code === 200 && Array.isArray(body.data)) {
              renewHistory.value = body.data;
            } else {
              renewHistory.value = [];
            }
            renewHistoryVisible.value = true;
          } catch (e) {
            ElementPlus.ElMessage.error('加载续卡历史失败：' + (e?.message || String(e)));
            renewHistory.value = [];
          } finally {
            renewHistoryLoading.value = false;
          }
        }

        function renderField(field, form) {
          const modelKey = field.key;
          const label = field.label || field.key;
          const target = form || createForm;

          // remainingTimes: 只在选择次卡时显示
          if (modelKey === 'remainingTimes') {
            const cardTypeId = target.cardTypeId;
            const selectedCardType = props.cardTypes?.find(ct => ct.id === cardTypeId);
            const isTimesCard = selectedCardType?.type === 'TIMES';
            
            // 如果不是次卡，不显示该字段
            if (!isTimesCard) {
              return null;
            }
            
            // 如果是次卡，显示数字输入框
            return h(ElementPlus.ElFormItem, { label, prop: modelKey }, () =>
              h(ElementPlus.ElInputNumber, {
                modelValue: target[modelKey],
                'onUpdate:modelValue': (v) => target[modelKey] = v,
                controlsPosition: 'right',
                class: 'full-width',
                min: 0
              })
            );
          }

          // number-ish -> input-number (must win over "time" substring, e.g. remainingTimes)
          if (field.type === 'number') {
            return h(ElementPlus.ElFormItem, { label, prop: modelKey }, () =>
              h(ElementPlus.ElInputNumber, {
                modelValue: target[modelKey],
                'onUpdate:modelValue': (v) => target[modelKey] = v,
                controlsPosition: 'right',
                class: 'full-width'
              })
            );
          }

          // status switch (1/0)
          if (field.type === 'switch' || modelKey === 'status') {
            return h(ElementPlus.ElFormItem, { label, prop: modelKey }, () =>
              h(ElementPlus.ElSwitch, {
                modelValue: target[modelKey] === 1 || target[modelKey] === '1' || target[modelKey] === true,
                'onUpdate:modelValue': (v) => target[modelKey] = v ? 1 : 0,
                activeText: '启用',
                inactiveText: '禁用'
              })
            );
          }

          // select
          if (field.type === 'select') {
            const opts = typeof field.options === 'function'
              ? field.options({ currentEmployeeId: props.currentEmployeeId, module: props.module, cardTypes: props.cardTypes, employees: props.employees })
              : (field.options || []);
            // 调试：如果是员工选择框，打印选项
            if (modelKey === 'employeeId') {
              console.log('[renderField] employeeId 字段 - employees prop:', props.employees);
              console.log('[renderField] employeeId 字段 - options:', opts);
            }
            return h(ElementPlus.ElFormItem, { label, prop: modelKey }, () =>
              h(ElementPlus.ElSelect, {
                modelValue: target[modelKey],
                'onUpdate:modelValue': (v) => {
                  target[modelKey] = v;
                  // 如果选择的是卡种，且是次卡，自动填充剩余次数
                  if (modelKey === 'cardTypeId' && form === createForm) {
                    const selectedCardType = props.cardTypes?.find(ct => ct.id === v);
                    if (selectedCardType?.type === 'TIMES') {

            cardTypes.value = [];

            const res = await http.get('/api/card-types');
            const body = res.data || {};
            if (body.code === 200 && Array.isArray(body.data)) {
              // 调试：打印返回的卡种列表
              console.log('[loadCardTypes] 后端返回的卡种列表:', body.data);
              const filtered = body.data.filter(x => x && x.status !== 0);
              console.log('[loadCardTypes] 过滤后的卡种列表:', filtered);
              cardTypes.value = filtered;
            }
          } catch (e) {
            console.error('[loadCardTypes] 加载卡种失败:', e);
            // ignore; UI can still work with raw id
          }
        }

        async function loadEmployees() {

            employees.value = [];
            return;

            const res = await http.get('/api/employees');
            const body = res.data || {};

            if (body.code === 200 && Array.isArray(body.data)) {
              // 只加载启用的员工

              console.log('[loadEmployees] 过滤后的员工列表:', filtered);
              employees.value = filtered;

          } catch (e) {
            console.error('[loadEmployees] 加载员工列表失败:', e);
            // ignore; UI can still work with raw id

        }

        const modules = [
          // MemberController -> 会员管理
          {
            key: 'members',
            title: '会员管理',
            icon: 'UserFilled',
            list: { method: 'GET', url: '/api/members' },
            // MemberController uses MemberRequest for create; include employeeId
            create: {
              url: '/api/members',
              payload: (form, ctx) => ({
                name: form.name,
                gender: form.gender,
                phone: form.phone,
                idCard: form.idCard,
                cardTypeId: form.cardTypeId,
                startDate: form.startDate,
                remainingTimes: form.remainingTimes,
                employeeId: (form.employeeId !== '' && form.employeeId !== null && form.employeeId !== undefined)
                  ? form.employeeId
                  : (ctx?.currentEmployeeId ?? null)
              })
            },
            delete: { url: (row) => '/api/members/' + row.id },
            update: {
              url: (row) => '/api/members/' + row.id,
              payload: (form, row, ctx) => ({
                name: form.name,
                gender: form.gender,
                phone: form.phone,
                idCard: form.idCard,
                // MemberController update uses MemberRequest; backend only updates base info
              })
            },
            listParams: [
              { key: 'name', placeholder: '姓名' },
              { key: 'phone', placeholder: '手机号' },
              { key: 'isExpired', placeholder: '是否过期(0/1)' }
            ],
            columns: [
              { key: 'id', label: 'ID', minWidth: 80 },
              { key: 'name', label: '姓名' },
              { key: 'gender', label: '性别' },
              { key: 'phone', label: '手机号' },
              { key: 'idCard', label: '身份证号', minWidth: 160 },
              { key: 'cardTypeId', label: '卡种', minWidth: 140, value: (row) => row?.cardType?.name || row?.cardTypeName || row?.cardTypeId || '' },
              { key: 'startDate', label: '开始日期', minWidth: 120 },
              { key: 'expireDate', label: '到期日期', minWidth: 120 },
              { 
                key: 'expireWarning', 
                label: '到期提醒', 
                minWidth: 100,
                value: (row) => {
                  if (!row?.expireDate) return '';
                  const expireDate = dayjs(row.expireDate);
                  const today = dayjs();
                  const daysLeft = expireDate.diff(today, 'day');
                  if (daysLeft < 0) return '已过期';
                  if (daysLeft <= 7) return `${daysLeft}天后到期`;
                  return '';
                }
              },
              { key: 'remainingTimes', label: '剩余次数', minWidth: 100 },
              { key: 'isExpired', label: '过期(0/1)', minWidth: 100 },
              { 
                key: 'lastCheckinTime', 
                label: '最近签到时间', 
                minWidth: 160,
                value: (row) => {
                  if (!row?.lastCheckinTime) return '未签到';
                  return dayjs(row.lastCheckinTime).format('YYYY-MM-DD HH:mm:ss');
                }
              },
              { 
                key: 'noCheckinOver7Days', 
                label: '超过7天未签到', 
                minWidth: 140,
                value: (row) => {
                  if (row?.noCheckinOver7Days === 1) return '是';
                  return '否';
                }
              },
              { 
                key: 'firstEmployeeId', 
                label: '首次开卡员工', 
                minWidth: 140,
                value: (row, employees = []) => {
                  if (!row?.firstEmployeeId) return '';
                  // 尝试从关联对象获取
                  if (row?.firstEmployee?.name) return row.firstEmployee.name;
                  // 从员工列表中查找
                  const emp = employees.find(e => e.id === row.firstEmployeeId);
                  return emp ? (emp.name || emp.username || String(row.firstEmployeeId)) : String(row.firstEmployeeId);
                }
              },
              { 
                key: 'lastEmployeeId', 
                label: '最新续卡员工', 
                minWidth: 140,
                value: (row, employees = []) => {
                  if (!row?.lastEmployeeId) return '';
                  // 尝试从关联对象获取
                  if (row?.lastEmployee?.name) return row.lastEmployee.name;
                  // 从员工列表中查找
                  const emp = employees.find(e => e.id === row.lastEmployeeId);
                  return emp ? (emp.name || emp.username || String(row.lastEmployeeId)) : String(row.lastEmployeeId);
                }
              },
              { key: 'status', label: '状态(1/0)', minWidth: 100 },
              { key: 'createdAt', label: '创建时间', minWidth: 160 },
              { key: 'updatedAt', label: '更新时间', minWidth: 160 }
            ],
            formFields: [
              { key: 'name', label: '姓名' },
              {
                key: 'gender',
                label: '性别',
                type: 'select',
                placeholder: '请选择性别',
                options: [
                  { value: '男', label: '男' },
                  { value: '女', label: '女' }
                ],
                default: '男'
              },
              { key: 'phone', label: '手机号' },
              { key: 'idCard', label: '身份证号' },
              {
                key: 'cardTypeId',
                label: '卡种',
                type: 'select',
                placeholder: '请选择卡种',
                options: ({ cardTypes }) => (cardTypes || []).map(ct => ({ value: ct.id, label: `${ct.name}（¥${ct.price}）` })),
                default: ({ cardTypes }) => (cardTypes && cardTypes[0] ? cardTypes[0].id : 1)
              },
              { key: 'startDate', label: '开始日期', type: 'date' },
              { key: 'remainingTimes', label: '剩余次数(次卡)', type: 'number' },
              {
                key: 'employeeId',
                label: '员工归属',
                type: 'select',
                placeholder: '请选择员工',
                options: ({ employees }) => {
                  const empList = Array.isArray(employees) ? employees : [];
                  console.log('[employeeId options] 员工列表:', empList);
                  return empList.map(emp => ({ value: emp.id, label: `${emp.name || emp.username || '未知'} (${emp.username || ''})` }));
                },
                default: ({ currentEmployeeId }) => currentEmployeeId ?? null
              }
            ]
          },

          // CardTypeController -> 卡种管理
          {
            key: 'cardTypes',
            title: '卡种管理',
            icon: 'Tickets',
            // 管理页显示全部（含禁用）
            list: { method: 'GET', url: '/api/card-types/all' },
            create: { url: '/api/card-types' },
            delete: { url: (row) => '/api/card-types/' + row.id },
            update: { url: (row) => '/api/card-types/' + row.id },
            columns: [
              { key: 'id', label: 'ID', minWidth: 80 },
              { key: 'name', label: '卡种名称' },
              { key: 'type', label: '类型(MONTH/QUARTER/YEAR/TIMES)', minWidth: 220 },
              { key: 'duration', label: '时长/次数', minWidth: 120 },
              { key: 'price', label: '价格', minWidth: 120 },
              { key: 'status', label: '状态(1/0)', minWidth: 110 },
              { key: 'createdAt', label: '创建时间', minWidth: 160 },
              { key: 'updatedAt', label: '更新时间', minWidth: 160 }
            ],
            formFields: [
              { key: 'name', label: '卡种名称' },
              { key: 'type', label: '类型(MONTH/QUARTER/YEAR/TIMES)', default: 'MONTH' },
              { key: 'duration', label: '时长/次数', type: 'number', default: 1 },
              { key: 'price', label: '价格', default: '299.00' },
              { key: 'status', label: '状态', type: 'switch', default: 1 }
            ]
          },

          // EmployeeController -> 员工管理（管理员）
          {
            key: 'employees',
            title: '员工管理',
            icon: 'Avatar',
            list: { method: 'GET', url: '/api/employees' },
            create: { url: '/api/employees' },
            delete: { url: (row) => '/api/employees/' + row.id },
            update: { url: (row) => '/api/employees/' + row.id },
            columns: [
              { key: 'id', label: 'ID', minWidth: 80 },
              { key: 'username', label: '用户名' },
              // password intentionally NOT displayed (backend also nulls it)
              { key: 'name', label: '姓名' },
              { key: 'phone', label: '手机号' },
              { key: 'role', label: '角色(ADMIN/STAFF)', minWidth: 160 },
              { key: 'status', label: '状态(1/0)', minWidth: 110 },
              { key: 'createdAt', label: '创建时间', minWidth: 160 },
              { key: 'updatedAt', label: '更新时间', minWidth: 160 }
            ],
            formFields: [
              { key: 'username', label: '用户名' },
              { key: 'password', label: '密码' },
              { key: 'name', label: '姓名' },
              { key: 'phone', label: '手机号' },
              { key: 'role', label: '角色(ADMIN/STAFF)', default: 'STAFF' },
              { key: 'status', label: '状态', type: 'switch', default: 1 }
            ]
          },

          // CommissionRuleController -> 提成规则（管理员）
          {
            key: 'commissionRules',
            title: '提成规则',
            icon: 'Coin',
            list: { method: 'GET', url: '/api/commission-rules' },
            create: { url: '/api/commission-rules' },
            delete: { url: (row) => '/api/commission-rules/' + row.id },
            update: { url: (row) => '/api/commission-rules/' + row.id },
            columns: [
              { key: 'id', label: 'ID', minWidth: 80 },
              { key: 'cardTypeId', label: '卡种ID', minWidth: 100 },
              { key: 'transactionType', label: '交易类型(NEW/RENEW)', minWidth: 180 },
              { key: 'commissionRate', label: '提成比例(%)', minWidth: 130 },
              { key: 'fixedAmount', label: '固定提成', minWidth: 120 },
              { key: 'createdAt', label: '创建时间', minWidth: 160 },
              { key: 'updatedAt', label: '更新时间', minWidth: 160 }
            ],
            formFields: [
              { key: 'cardTypeId', label: '卡种ID', type: 'number', default: 1 },
              { key: 'transactionType', label: '交易类型(NEW/RENEW)', default: 'NEW' },
              { key: 'commissionRate', label: '提成比例(%)', default: '15.00' },
              { key: 'fixedAmount', label: '固定提成(可空)', default: '' }
            ]
          },

          // FinancialController -> 财务统计（只读，旧接口）
          {
            key: 'financialStats',
            title: '财务统计（旧）',
            icon: 'DataAnalysis',
            list: {
              method: 'GET',
              url: '/api/financial/commission-stats',
              params: (p) => ({ month: p.month || dayjs().format('YYYY-MM') })
            },
            listParams: [{ key: 'month', type: 'month', placeholder: '选择月份', default: dayjs().format('YYYY-MM') }],
            columns: [
              { key: 'employeeId', label: '员工ID', minWidth: 100 },
              { key: 'employeeName', label: '员工姓名', minWidth: 140 },
              { key: 'month', label: '月份', minWidth: 110 },
              { key: 'totalCommission', label: '总提成', minWidth: 120 },
              { key: 'newCardCount', label: '新开卡数量', minWidth: 120 },
              { key: 'newCardCommission', label: '新开卡提成', minWidth: 120 },
              { key: 'renewCount', label: '续费数量', minWidth: 120 },
              { key: 'renewCommission', label: '续费提成', minWidth: 120 }
            ],
            formFields: [] // read-only
          },

          // FinancialController -> 开卡统计（新接口）
          {
            key: 'cardSummary',
            title: '开卡统计',
            icon: 'CreditCard',
            list: {
              method: 'GET',
              url: '/api/financial/card-summary',
              params: (p) => ({ month: p.month || dayjs().format('YYYY-MM') })
            },
            listParams: [{ key: 'month', type: 'month', placeholder: '选择月份', default: dayjs().format('YYYY-MM') }],
            columns: [
              { key: 'employeeId', label: '员工ID', minWidth: 100 },
              { key: 'employeeName', label: '员工姓名', minWidth: 140 },
              { key: 'month', label: '月份', minWidth: 110 },
              { key: 'cardCount', label: '开卡数量', minWidth: 120 },
              { key: 'totalCardAmount', label: '开卡金额', minWidth: 120, value: (row) => row?.totalCardAmount ? `¥${Number(row.totalCardAmount).toFixed(2)}` : '¥0.00' },
              { key: 'commissionAmount', label: '提成金额', minWidth: 120, value: (row) => {
                const amount = Number(row?.totalCardAmount || 0);
                const commission = amount * 0.02; // 2%提成
                return `¥${commission.toFixed(2)}`;
              }},
              { 
                key: 'cardMembers', 
                label: '开卡明细', 
                minWidth: 300,
                clickable: true, // 标记为可点击
                value: (row) => {
                  if (!row?.cardMembers || !Array.isArray(row.cardMembers) || row.cardMembers.length === 0) {
                    return '无';
                  }
                  const count = row.cardMembers.length;
                  return `共${count}条记录（点击查看详情）`;
                }
              }
            ],
            formFields: [], // read-only
            // 自定义渲染，显示汇总信息
            customRender: true
          },

          // FinancialController -> 交易明细（只读）
          {
            key: 'transactions',
            title: '交易明细',
            icon: 'Document',
            list: {
              method: 'GET',
              url: '/api/financial/transactions',
              params: (p) => {
                const params = {};
                if (p.employeeId) params.employeeId = p.employeeId;
                if (p.month) params.month = p.month;
                if (p.transactionType) params.transactionType = p.transactionType;
                return params;
              }
            },
            listParams: [
              { key: 'employeeId', placeholder: '员工ID(可选)', type: 'number' },
              { key: 'month', type: 'month', placeholder: '月份(YYYY-MM，可选)' },
              { key: 'transactionType', type: 'select', placeholder: '交易类型', options: [
                { label: '全部', value: '' },
                { label: '新会员办卡', value: 'NEW' },
                { label: '旧会员续卡', value: 'RENEW' }
              ]}
            ],
            columns: [
              { key: 'id', label: 'ID', minWidth: 80 },
              { key: 'member', label: '会员', minWidth: 140, value: (row) => {
                const member = row.member || {};
                return member.name ? `${member.name} (${member.phone || ''})` : (row.memberName || row.memberId || '');
              }},
              { key: 'cardType', label: '卡种', minWidth: 120, value: (row) => row.cardType?.name || row.cardTypeName || row.cardTypeId || '' },
              { key: 'transactionType', label: '交易类型', minWidth: 120, value: (row) => {
                const type = row.transactionType || '';
                if (type === 'NEW') return '新会员办卡';
                if (type === 'RENEW') return '旧会员续卡';
                return type;
              }},
              { key: 'amount', label: '交易金额', minWidth: 120, value: (row) => `¥${Number(row.amount || 0).toFixed(2)}` },
              { key: 'employee', label: '操作员工', minWidth: 120, value: (row) => row.employee?.name || row.employeeName || row.employeeId || '' },
              { key: 'transactionDate', label: '交易日期', minWidth: 120 },
              { key: 'remark', label: '备注', minWidth: 160 },
              { key: 'createdAt', label: '创建时间', minWidth: 160, value: (row) => row.createdAt ? dayjs(row.createdAt).format('YYYY-MM-DD HH:mm:ss') : '' }
            ],
            formFields: [] // read-only
          }
        ];

        const moduleMap = computed(() => {
          const map = {};
          modules.forEach(m => map[m.key] = m);
          return map;
        });
        const activeModule = computed(() => {
          const key = activeKey.value;
          const module = moduleMap.value[key];
          if (!module) {
            console.warn(`[activeModule] 未找到模块 key="${key}", 使用默认模块`);
            return modules[0];
          }
          console.log(`[activeModule] 当前模块: key="${key}", title="${module.title}", url="${module.list?.url}"`);
          return module;
        });

        function openLogin() {
          loginDialogVisible.value = true;
        }

        async function doLogin() {
          loginLoading.value = true;
          try {
            const res = await http.post('/api/auth/login', {
              username: loginForm.username,
              password: loginForm.password
            });
            const body = res.data || {};
            if (body.code !== 200) throw new Error(body.message || '登录失败');
            const data = body.data || {};
            setToken(data.token || '');
            authVersion.value++;
            currentUser.username = data.username || loginForm.username;
            currentUser.name = data.name || '';
            currentUser.role = data.role || '';
            currentUser.employeeId = data.employeeId || null;
            loginDialogVisible.value = false;
            ElementPlus.ElMessage.success('登录成功');
            await loadCardTypes();
            await loadEmployees();
          } catch (e) {
            ElementPlus.ElMessage.error(e?.message || String(e));
          } finally {
            loginLoading.value = false;
          }
        }

        async function doLogout() {
          try {
            await http.post('/api/auth/logout');
          } catch { /* ignore */ }
          clearToken();
          authVersion.value++;
          currentUser.username = '';
          currentUser.name = '';
          currentUser.role = '';
          currentUser.employeeId = null;
          ElementPlus.ElMessage.success('已退出');
          cardTypes.value = [];
        }

        const tokenPresent = computed(() => !!getToken());
        const userLabel = computed(() => {
          if (!tokenPresent.value) return '未登录';
          const name = currentUser.name || currentUser.username || '已登录';
          const role = currentUser.role ? ` (${currentUser.role})` : '';
          return name + role;
        });

        // global 401 handler (basic)
        http.interceptors.response.use(
          (r) => r,
          (err) => {
            const status = err?.response?.status;
            if (status === 401) {
              ElementPlus.ElMessage.warning('登录已过期，请重新登录');
              openLogin();
            } else if (status === 403) {
              ElementPlus.ElMessage.error('权限不足（需要管理员权限）');
            }
            return Promise.reject(err);
          }
        );

        onMounted(() => {
          if (!getToken()) {
            openLogin();
          } else {
            loadCardTypes();
          }
        });

        return {
          modules, activeKey, activeModule,
          loginDialogVisible, loginForm, loginLoading,
          tokenPresent, userLabel, authVersion,
          currentUser,
          cardTypes,
          employees,
          loadCardTypes,
          loadEmployees,
          openLogin, doLogin, doLogout
        };
      },
      render() {
        return h(ElementPlus.ElContainer, { class: 'layout' }, () => [
          h(ElementPlus.ElAside, { width: '220px', class: 'aside' }, () => [
            h('div', { class: 'brand' }, [
              h('span', null, 'Gym Admin'),
              h('small', null, '一体化后台')
            ]),
            h(ElementPlus.ElMenu, {
              defaultActive: this.activeKey,
              onSelect: (index) => { 
                console.log(`[Menu] 选择菜单项: ${index}`);
                this.activeKey = index; 
              },
              backgroundColor: 'transparent',
              textColor: '#cbd5e1',
              activeTextColor: '#ffffff'
            }, () => this.modules.map(m =>
              h(ElementPlus.ElMenuItem, { index: m.key, key: m.key }, () => [
                (m.icon && window.ElementPlusIconsVue && window.ElementPlusIconsVue[m.icon])
                  ? h(ElementPlus.ElIcon, { style: 'margin-right: 8px;' }, () => h(window.ElementPlusIconsVue[m.icon]))
                  : null,
                h('span', null, m.title)
              ])
            ))
          ]),

          h(ElementPlus.ElContainer, null, () => [
            h(ElementPlus.ElHeader, { class: 'header' }, () => [
              h('div', { style: 'display:flex; gap:10px; align-items:center;' }, [
                h('div', { style: 'font-weight:700;' }, this.activeModule.title),
                h('span', { class: 'muted' }, 'BaseURL: '),
                h('span', { class: 'mono muted' }, 'http://localhost:8080')
              ]),
              h('div', { style: 'display:flex; gap:10px; align-items:center;' }, [
                h(ElementPlus.ElTag, { type: this.tokenPresent ? 'success' : 'info' }, () => this.userLabel),
                !this.tokenPresent
                  ? h(ElementPlus.ElButton, { type: 'primary', onClick: this.openLogin }, () => '登录')
                  : h(ElementPlus.ElButton, { onClick: this.doLogout }, () => '退出')
              ])
            ]),

            h(ElementPlus.ElMain, { class: 'content' }, () => [
              h(CrudView, { 
                module: this.activeModule, 
                authVersion: this.authVersion, 
                isAuthed: this.tokenPresent, 
                currentEmployeeId: this.currentUser?.employeeId, 
                cardTypes: Array.isArray(this.cardTypes) ? this.cardTypes : [], 
                employees: Array.isArray(this.employees) ? this.employees : [], 
                onRefreshCardTypes: this.loadCardTypes, 
                onRefreshEmployees: this.loadEmployees 
              })
            ])
          ]),

          h(ElementPlus.ElDialog, {
            modelValue: this.loginDialogVisible,
            'onUpdate:modelValue': (v) => this.loginDialogVisible = v,
            title: '登录',
            width: '480px',
            closeOnClickModal: false,
            closeOnPressEscape: false
          }, {
            default: () => [
              h(ElementPlus.ElAlert, {
                type: 'info',
                showIcon: true,
                title: '提示',
                description: '系统接口需要 Authorization Bearer Token。请先登录获取 token。'
              }),
              h('div', { style: 'height: 12px;' }),
              h(ElementPlus.ElForm, { model: this.loginForm, labelWidth: 90 }, () => [
                h(ElementPlus.ElFormItem, { label: '用户名' }, () =>
                  h(ElementPlus.ElInput, {
                    modelValue: this.loginForm.username,
                    'onUpdate:modelValue': (v) => this.loginForm.username = v,
                    clearable: true
                  })
                ),
                h(ElementPlus.ElFormItem, { label: '密码' }, () =>
                  h(ElementPlus.ElInput, {
                    modelValue: this.loginForm.password,
                    'onUpdate:modelValue': (v) => this.loginForm.password = v,
                    type: 'password',
                    showPassword: true
                  })
                )
              ])
            ],
            footer: () => [
              h(ElementPlus.ElButton, { onClick: () => this.loginDialogVisible = false }, () => '稍后'),
              h(ElementPlus.ElButton, { type: 'primary', loading: this.loginLoading, onClick: this.doLogin }, () => '登录')
            ]
          })
        ]);
      }
    });

    // 注意：不要在 <script> 内写出字面量 "</scr" + "ipt>"（即便在注释里也会提前结束脚本，导致白屏）
    // icons CDN: https://unpkg.com/@element-plus/icons-vue

        const app = createApp(App);
        app.use(window.ElementPlus);
        // register all icons
        if (window.ElementPlusIconsVue) {
          for (const [key, component] of Object.entries(window.ElementPlusIconsVue)) {
            app.component(key, component);
          }
        }
        app.mount('#app');
      } catch (e) {
        showBootError('前端启动失败（白屏兜底面板）', (e && (e.stack || e.message)) ? (e.stack || e.message) : String(e));
      }
    })();
  </script>
</body>
</html>
